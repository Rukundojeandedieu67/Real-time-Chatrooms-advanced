name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://chat:chat@localhost:5432/chat
      SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -c pyproject.toml -r apps services config
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Migration check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest
