repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: scan-secrets
        name: scan secrets
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: false
